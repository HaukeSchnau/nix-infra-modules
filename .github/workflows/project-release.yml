name: Publish Project Release

on:
  workflow_call:
    inputs:
      package:
        description: Flake package containing the immutable Project Release
        required: false
        type: string
        default: projectRelease
      verification_check:
        description: Optional flake check that covers the deployment-specific Release contract
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  NIX_CONFIG: experimental-features = nix-command flakes

jobs:
  publish:
    name: Verify, publish, and promote
    runs-on: [self-hosted, nixos]
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Verify Project
        run: |
          set -euo pipefail
          nix --version
          check='${{ inputs.verification_check }}'
          if [ -z "$check" ]; then
            nix flake check --print-build-logs
          else
            system="$(nix eval --impure --raw --expr builtins.currentSystem)"
            nix build ".#checks.${system}.${check}" --no-link --print-build-logs
          fi

      - name: Build immutable Release
        run: |
          set -euo pipefail
          project="$(nix eval --raw .#lib.project.project)"
          release="$(nix build ".#${{ inputs.package }}" --no-link --print-out-paths --print-build-logs)"
          test "$(printf '%s\n' "$release" | wc -l)" -eq 1
          printf 'PROJECT_NAME=%s\n' "$project" >> "$GITHUB_ENV"
          printf 'RELEASE_STORE_PATH=%s\n' "$release" >> "$GITHUB_ENV"

      - name: Wait for cache publication
        run: |
          set -euo pipefail
          : "${PROJECT_RELEASE_CACHE_URL:?runner does not provide PROJECT_RELEASE_CACHE_URL}"
          basename="${RELEASE_STORE_PATH#/nix/store/}"
          store_hash="${basename%%-*}"
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error \
              "${PROJECT_RELEASE_CACHE_URL%/}/${store_hash}.narinfo" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Release was not published to the configured cache within ten minutes" >&2
          exit 1

      - name: Promote exact Release
        run: |
          set -euo pipefail
          : "${PROJECT_RELEASE_PROMOTION_TOKEN:?runner does not provide PROJECT_RELEASE_PROMOTION_TOKEN}"
          printf -v payload \
            '{"revision":"%s","storePath":"%s","source":"actions"}' \
            "$GITHUB_SHA" "$RELEASE_STORE_PATH"

          promotion_urls=()
          if [ -n "${PROJECT_RELEASE_PROMOTION_TARGETS:-}" ]; then
            mapfile -t promotion_urls < <(
              jq -er --arg project "$PROJECT_NAME" \
                '(.[$project] // .["*"] // [])[]' \
                <<<"$PROJECT_RELEASE_PROMOTION_TARGETS"
            )
          elif [ -n "${PROJECT_RELEASE_PROMOTION_URL:-}" ]; then
            promotion_urls+=("$PROJECT_RELEASE_PROMOTION_URL")
          fi
          [ "${#promotion_urls[@]}" -gt 0 ] || {
            echo "Runner does not provide a promotion target for $PROJECT_NAME" >&2
            exit 1
          }

          for promotion_url in "${promotion_urls[@]}"; do
            promoted=false
            for _ in $(seq 1 30); do
              status="$(curl --silent --show-error \
                --output promotion.json \
                --write-out '%{http_code}' \
                --request POST \
                --header "Authorization: Bearer ${PROJECT_RELEASE_PROMOTION_TOKEN}" \
                --header "Content-Type: application/json" \
                --data "$payload" \
                "${promotion_url%/}/deploy/${PROJECT_NAME}")"
              if [ "$status" = 202 ]; then
                cat promotion.json
                promoted=true
                break
              fi
              cat promotion.json >&2
              if [ "$status" != 503 ]; then
                if [ "$status" = 409 ]; then
                  echo "Release is valid but incompatible with the current infra bindings at $promotion_url" >&2
                else
                  echo "Promotion at $promotion_url was rejected with HTTP ${status}" >&2
                fi
                exit 1
              fi
              sleep 10
            done
            [ "$promoted" = true ] || {
              echo "Release could not be activated at $promotion_url within five minutes" >&2
              exit 1
            }
          done
