[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "project-controller"
version = "2"
requires-python = ">=3.12"

[project.scripts]
project = "project_controller.cli:main"

[tool.setuptools]
packages = ["project_controller"]

[tool.mypy]
check_untyped_defs = true
warn_unused_ignores = true
