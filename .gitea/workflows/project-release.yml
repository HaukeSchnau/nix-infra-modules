name: Publish Project Release

on:
  workflow_call:
    inputs:
      package:
        description: Flake package containing the immutable Project Release
        required: false
        type: string
        default: projectRelease
      verification_check:
        description: Optional flake check that covers the deployment-specific Release contract
        required: false
        type: string
        default: ""
      readiness_url:
        description: Optional public readiness URL whose JSON revision must match the promoted commit
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  NIX_CONFIG: experimental-features = nix-command flakes

jobs:
  publish:
    name: Verify, publish, and promote
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Add Nix to PATH
        run: |
          set -euo pipefail
          if [ -x /run/current-system/sw/bin/nix ]; then
            echo /run/current-system/sw/bin >> "$GITHUB_PATH"
            export PATH="/run/current-system/sw/bin:$PATH"
          fi
          nix --version

      - name: Add release tools to PATH
        run: |
          set -euo pipefail
          jq_path="$(nix build 'nixpkgs#jq^bin' --no-link --print-out-paths)"
          printf '%s/bin\n' "$jq_path" >> "$GITHUB_PATH"

      - name: Preflight host bindings
        run: |
          set -euo pipefail
          : "${PROJECT_RELEASE_PROMOTION_TOKEN:?runner does not provide PROJECT_RELEASE_PROMOTION_TOKEN}"
          project="$(nix eval --raw .#lib.project.project)"
          descriptor="$(nix eval --json .#lib.project)"
          promotion_urls_file="$RUNNER_TEMP/project-release-promotion-urls"
          : > "$promotion_urls_file"

          if [ -n "${PROJECT_RELEASE_PROMOTION_TARGETS:-}" ]; then
            export project
            nix eval --impure --raw --expr '
              let
                targets = builtins.fromJSON (builtins.getEnv "PROJECT_RELEASE_PROMOTION_TARGETS");
                project = builtins.getEnv "project";
                urls =
                  if builtins.hasAttr project targets
                  then builtins.getAttr project targets
                  else targets."*" or [];
              in
              builtins.concatStringsSep "\n" urls
            ' > "$promotion_urls_file"
          elif [ -n "${PROJECT_RELEASE_PROMOTION_URL:-}" ]; then
            printf '%s\n' "$PROJECT_RELEASE_PROMOTION_URL" > "$promotion_urls_file"
          fi
          [ -s "$promotion_urls_file" ] || {
            echo "Runner does not provide a promotion target for $project" >&2
            exit 1
          }

          payload="$(jq -cn --argjson descriptor "$descriptor" '{descriptor: $descriptor}')"
          while IFS= read -r promotion_url || [ -n "$promotion_url" ]; do
            status="$(curl --silent --show-error \
              --output preflight.json \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${PROJECT_RELEASE_PROMOTION_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "${promotion_url%/}/preflight/${project}")"
            cat preflight.json
            if [ "$status" != 200 ]; then
              echo "Release contract is incompatible with host bindings at $promotion_url (HTTP $status)" >&2
              exit 1
            fi
          done < "$promotion_urls_file"

          printf 'PROJECT_NAME=%s\n' "$project" >> "$GITHUB_ENV"
          printf 'PROMOTION_URLS_FILE=%s\n' "$promotion_urls_file" >> "$GITHUB_ENV"

      - name: Verify Project
        run: |
          set -euo pipefail
          check='${{ inputs.verification_check }}'
          if [ -z "$check" ]; then
            nix flake check --print-build-logs
          else
            system="$(nix eval --impure --raw --expr builtins.currentSystem)"
            nix build ".#checks.${system}.${check}" --no-link --print-build-logs
          fi

      - name: Build immutable Release
        run: |
          set -euo pipefail
          release="$(nix build ".#${{ inputs.package }}" --no-link --print-out-paths --print-build-logs)"
          test "$(printf '%s\n' "$release" | wc -l)" -eq 1
          printf 'RELEASE_STORE_PATH=%s\n' "$release" >> "$GITHUB_ENV"

      - name: Wait for cache publication
        run: |
          set -euo pipefail
          : "${PROJECT_RELEASE_CACHE_URL:?runner does not provide PROJECT_RELEASE_CACHE_URL}"
          basename="${RELEASE_STORE_PATH#/nix/store/}"
          store_hash="${basename%%-*}"
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error \
              "${PROJECT_RELEASE_CACHE_URL%/}/${store_hash}.narinfo" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Release was not published to the configured cache within ten minutes" >&2
          exit 1

      - name: Promote exact Release
        run: |
          set -euo pipefail
          : "${PROJECT_RELEASE_PROMOTION_TOKEN:?runner does not provide PROJECT_RELEASE_PROMOTION_TOKEN}"
          git fetch --no-tags origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          remote_revision="$(git rev-parse "refs/remotes/origin/${GITHUB_REF_NAME}")"
          if [ "$remote_revision" != "$GITHUB_SHA" ]; then
            echo "Refusing to promote superseded revision $GITHUB_SHA; ${GITHUB_REF_NAME} is $remote_revision" >&2
            exit 1
          fi
          printf -v payload \
            '{"revision":"%s","storePath":"%s","source":"actions"}' \
            "$GITHUB_SHA" "$RELEASE_STORE_PATH"

          while IFS= read -r promotion_url || [ -n "$promotion_url" ]; do
            promoted=false
            for _ in $(seq 1 30); do
              status="$(curl --silent --show-error \
                --output promotion.json \
                --write-out '%{http_code}' \
                --request POST \
                --header "Authorization: Bearer ${PROJECT_RELEASE_PROMOTION_TOKEN}" \
                --header "Content-Type: application/json" \
                --data "$payload" \
                "${promotion_url%/}/deploy/${PROJECT_NAME}")"
              if [ "$status" = 202 ]; then
                cat promotion.json
                promoted=true
                break
              fi
              cat promotion.json >&2
              if [ "$status" != 503 ]; then
                if [ "$status" = 409 ]; then
                  echo "Release is valid but incompatible with the current infra bindings at $promotion_url" >&2
                else
                  echo "Promotion at $promotion_url was rejected with HTTP ${status}" >&2
                fi
                exit 1
              fi
              sleep 10
            done
            [ "$promoted" = true ] || {
              echo "Release could not be activated at $promotion_url within five minutes" >&2
              exit 1
            }
          done < "$PROMOTION_URLS_FILE"

      - name: Verify public deployment
        if: inputs.readiness_url != ''
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 5 \
              '${{ inputs.readiness_url }}' > readiness.json \
              && [ "$(jq -r '.revision // empty' readiness.json)" = "$GITHUB_SHA" ]; then
              cat readiness.json
              exit 0
            fi
            sleep 5
          done
          echo "Public readiness did not report promoted revision $GITHUB_SHA within five minutes" >&2
          cat readiness.json >&2 2>/dev/null || true
          exit 1
